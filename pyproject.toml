[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-cython"
description = "Cython syntax parser for TreeSitter"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "cython"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "HivertMoZara", email = "worldmozara@163.com" }]
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/NCBM/tree-sitter-cython"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]
dev = [
    "ipython",
]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
